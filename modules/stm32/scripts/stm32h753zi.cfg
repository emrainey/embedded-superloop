source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

set WORKAREASIZE 0x8000
set CHIPNAME STM32H753ZI
set BOARDNAME NUCLEO-H753ZI
set ENABLE_LOW_POWER 1
set STOP_WATCHDOG 1
set CLOCK_FREQ 4000

source [find target/stm32h7x.cfg]
set _TARGETNAME [target current]

gdb_port 2331
telnet_port 2332

# No NRST on this board, use SYSRESETREQ only
# reset_config none
# cortex_m reset_config sysresetreq

# gdb_memory_map disable
# gdb_flash_program disable

# # Don't examine at startup, wait until gdb connects
# ${_TARGETNAME} configure -event examine-fail {}

# ${_TARGETNAME} configure -event gdb-attach {
#     halt
# }

proc after_init {} {
    global _TARGETNAME
    ${_TARGETNAME}.swo configure -protocol uart \
        -traceclk 480000000 \
        -pin-freq 20000000 \
        -output :2334 \
        -formatter false
    ${_TARGETNAME}.swo enable
    # Force reset via AIRCR if NRST not connected
    # ${_TARGETNAME} arp_examine
    # reset_config none
    # ${_TARGETNAME} arp_reset assert 0
}