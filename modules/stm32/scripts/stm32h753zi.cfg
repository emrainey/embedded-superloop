source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
set WORKAREASIZE 0x8000
set CHIPNAME STM32H753ZI
set BOARDNAME NUCLEO-H753ZI
source [find target/stm32h7x.cfg]
# Common port with how JLink works, but not the default for OpenOCD. This is to allow using JLink or OpenOCD
gdb_port 2331
telnet_port 2332
# Enable debug when in low power modes
set ENABLE_LOW_POWER 1
# Stop Watchdog counters when halt
set STOP_WATCHDOG 1
# STlink Debug clock frequency
set CLOCK_FREQ 8000
# RTT will be on 2333 but that is configured in the GDB script
# TODO replace Mhz w/ some template variable for CMake build?
tpiu config internal :2334 uart false 480000000 20000000